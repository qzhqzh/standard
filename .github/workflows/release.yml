name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build, attest, and release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7 snapshot
        with:
          python-version: "3.13"
      - name: Test and build
        run: |
          python -m pip install --disable-pip-version-check build
          python -m unittest discover -s tests -v
          python -m build
      - name: Attest distributions
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4 snapshot
        with:
          subject-path: "dist/*"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-distributions-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
