[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-standard"
version = "0.1.0"
description = "A policy-driven checker and reference repository for healthy, secure open-source projects"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "qzhqzh" }]
keywords = ["open-source", "security", "governance", "repository", "supply-chain"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "mypy>=1.17,<3",
  "ruff>=0.12,<1",
]

[project.scripts]
repo-standard = "repo_standard.cli:main"

[project.urls]
Homepage = "https://github.com/qzhqzh/standard"
Documentation = "https://github.com/qzhqzh/standard/tree/main/docs"
Issues = "https://github.com/qzhqzh/standard/issues"
Changelog = "https://github.com/qzhqzh/standard/blob/main/CHANGELOG.md"
Security = "https://github.com/qzhqzh/standard/security/policy"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
repo_standard = ["default_policy.toml", "py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unreachable = true
